# Release workflow.
#
# Status (verified 2026-08-02, locally with the same commands):
#   PROVEN   — `make build` (tfgen, schema generation, provider binary, and
#              nodejs/python/go SDK codegen; codegen requires the Pulumi CLI,
#              which is installed below), `npm install && npx tsc` in
#              sdk/nodejs, and `python -m build` in sdk/python all succeed.
#   UNPROVEN — the actual `npm publish` and `twine upload` steps have never
#              run: no NPM_TOKEN or PYPI_API_TOKEN secret is provisioned on
#              this repository. Those steps self-skip with a loud notice until
#              the secrets are armed (see README "Release publishing").
#   DONE     — provider plugin binaries ARE published as GitHub Release assets
#              (the publish-plugin job below), cross-compiled for linux/darwin/
#              windows on amd64+arm64, named per the Pulumi convention
#              pulumi-resource-busbar-v<ver>-<os>-<arch>.tar.gz, via the built-in
#              GITHUB_TOKEN (no extra secret). `pulumi plugin install resource
#              busbar <ver> --server github://api.github.com/GetBusbar/pulumi-busbar`
#              resolves them. A Pulumi-registry entry is still a separate follow-up.
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.26"

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The secrets context is not available in step-level `if`; surface
      # presence booleans here so publish steps can gate on them honestly.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      HAS_PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
    steps:
      - name: Checkout pulumi-busbar
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # tfgen shells out to the Pulumi CLI's language hosts to emit the SDKs.
      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build provider + SDKs
        run: make build VERSION=${{ steps.version.outputs.version }}

      # --- Publish SDKs ---------------------------------------------------
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Compile npm package
        working-directory: sdk/nodejs
        run: |
          sed -i "s/\${VERSION}/${{ steps.version.outputs.version }}/" package.json
          npm install
          npx tsc

      - name: Publish npm package
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        working-directory: sdk/nodejs
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: npm publish skipped
        if: ${{ env.HAS_NPM_TOKEN != 'true' }}
        run: echo "::warning title=npm publish SKIPPED::SKIPPED - secret NPM_TOKEN not provisioned on this repository. The npm package was built but NOT published. Provision NPM_TOKEN to arm this step."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build PyPI package
        working-directory: sdk/python
        run: |
          sed -i "s/^VERSION = .*/VERSION = \"${{ steps.version.outputs.version }}\"/" setup.py
          python -m pip install build twine
          python -m build

      - name: Publish PyPI package
        if: ${{ env.HAS_PYPI_API_TOKEN == 'true' }}
        working-directory: sdk/python
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: PyPI publish skipped
        if: ${{ env.HAS_PYPI_API_TOKEN != 'true' }}
        run: echo "::warning title=PyPI publish SKIPPED::SKIPPED - secret PYPI_API_TOKEN not provisioned on this repository. The wheel/sdist were built but NOT uploaded. Provision PYPI_API_TOKEN to arm this step."

      # The Go SDK is consumed directly from the tagged git module
      # (github.com/getbusbar/pulumi-busbar/sdk/go) — no separate publish step.

  # Create the GitHub Release up front so the parallel plugin-matrix uploads have a target
  # (uploading from a matrix without a pre-existing release races -> "release not found").
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create (or reuse) the GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! out=$(gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "pulumi-busbar ${GITHUB_REF_NAME}" \
              --verify-tag --generate-notes 2>&1); then
            if echo "$out" | grep -qi "already exists"; then
              echo "Release ${GITHUB_REF_NAME} already exists — reusing it."
            else
              echo "$out" >&2; exit 1
            fi
          else
            echo "$out"
          fi

  # Cross-compile the pulumi-resource-busbar plugin binary for every supported host and attach one
  # tarball per platform to the Release, using the built-in GITHUB_TOKEN (works today — this repo
  # owns the release). The provider embeds schema-embed.json via go:embed, so a plain `go build`
  # cross-compiles without the Pulumi CLI. Named per the Pulumi plugin convention so
  # `pulumi plugin install resource busbar <ver> --server github://api.github.com/GetBusbar/pulumi-busbar`
  # resolves the asset.
  publish-plugin:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build + package the plugin binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="pulumi-resource-busbar"
          [ "$GOOS" = windows ] && bin="${bin}.exe"
          ( cd provider && go build \
              -ldflags "-X github.com/getbusbar/pulumi-busbar/provider/pkg/version.Version=${ver}" \
              -o "${GITHUB_WORKSPACE}/${bin}" ./cmd/pulumi-resource-busbar )
          tarball="pulumi-resource-busbar-v${ver}-${GOOS}-${GOARCH}.tar.gz"
          tar -czf "$tarball" "$bin"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Attach to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${TARBALL}" --repo "${GITHUB_REPOSITORY}" --clobber
