name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  GO_VERSION: "1.26"

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pulumi-busbar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pulumi-busbar
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set version from tag
        id: version
        working-directory: pulumi-busbar
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release.py validate "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install pinned Pulumi CLI
        working-directory: pulumi-busbar
        run: |
          version=$(python3 scripts/check_pulumi.py --required-version)
          curl -fsSL https://get.pulumi.com -o "$RUNNER_TEMP/install-pulumi.sh"
          sh "$RUNNER_TEMP/install-pulumi.sh" --version "$version" --no-edit-path
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Build provider + SDKs
        working-directory: pulumi-busbar
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          GOMAXPROCS: "2"
          GOFLAGS: "-p=2"
        run: |
          make build VERSION="$RELEASE_VERSION"
          python3 scripts/release.py prepare "$RELEASE_VERSION"
          python3 scripts/release.py archives "$RELEASE_VERSION"

      # Build every package before publishing any assets or SDKs.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Build npm package
        working-directory: pulumi-busbar/sdk/nodejs
        run: |
          npm install
          npm pack

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build PyPI package
        working-directory: pulumi-busbar/sdk/python
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*

      - name: Publish provider archives and checksums
        working-directory: pulumi-busbar
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release.py publish-provider "$RELEASE_VERSION"

      - name: Commit and publish generated Go SDK tag
        working-directory: pulumi-busbar
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/release.py publish-sdk "$RELEASE_VERSION"

      - name: Publish npm package
        working-directory: pulumi-busbar/sdk/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --access public

      - name: Publish PyPI package
        working-directory: pulumi-busbar/sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
