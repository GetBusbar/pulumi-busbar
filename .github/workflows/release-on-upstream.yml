# Re-cut this Pulumi provider's own next release when the busbar stack ships.
#
# Upstream for THIS repo is GetBusbar/terraform-provider-busbar: provider/shim/go.mod requires it as
# a Go module, and the tfbridge generates the Pulumi schema + SDKs from it. That require IS this
# repo's record of what it was last built against.
#
# The busbar-core upstream-release dispatch is only a WAKE signal here - this repo does not consume
# busbar core directly. On any trigger this resolves terraform-provider-busbar's LATEST release and
# only proceeds if it is newer than the current go.mod pin. Runaway-safe: an idle day, or an
# already-ingested provider release, is a no-op.
#
# FLEET FAN-OUT ORDERING: the fan-out wakes every downstream repo simultaneously, so on an
# upstream-release dispatch the terraform-provider release we depend on usually does not exist yet
# (for busbar 1.5.3 the dispatch landed about five and a half minutes before terraform-provider
# v0.2.3 was published). Resolving "latest" once and going green was actively misleading. A
# dispatch-triggered run therefore POLLS for the sibling release for a bounded time, and if it still
# never appears it exits with a loud ::warning rather than a quiet "nothing to do".
#
# On a real advance this `go get`s the new terraform-provider-busbar tag into provider/shim, tidies,
# `make build`s (regenerates schema + the committed nodejs/python/go SDKs), bumps THIS repo's own v*
# tag, commits, and pushes the tag — which fires release.yml.
#
# PUBLISH REALITY (honest, no fake-green):
#   * The provider PLUGIN binaries ARE published, as GitHub Release assets, via the built-in
#     GITHUB_TOKEN (works today — see release.yml's publish-plugin job).
#   * The npm (@getbusbar/pulumi-busbar) and PyPI (pulumi_busbar) SDK publishes are SECRET-GATED and
#     currently SKIP LOUDLY: NO NPM_TOKEN or PYPI_API_TOKEN is provisioned at org or repo level.
#     To arm SDK publishing a human must add those two repository secrets:
#       gh secret set NPM_TOKEN      --repo GetBusbar/pulumi-busbar   # npm automation token, publish scope
#       gh secret set PYPI_API_TOKEN --repo GetBusbar/pulumi-busbar   # PyPI project/API token
#     Until then release.yml BUILDS both SDKs and emits a "SKIPPED - token not provisioned" warning
#     instead of publishing them. The Go SDK needs no token (consumed straight from the git tag).
#
# No plain `push:` trigger, so merging this file cannot itself cut a release. Pushes use
# RELEASE_DISPATCH_TOKEN (org secret, bypass-capable) as busbar-bot; plain GITHUB_TOKEN is rejected
# by branch protection on main.
name: release-on-upstream

on:
  repository_dispatch:
    types: [upstream-release]
  schedule:
    - cron: "57 6 * * *" # daily; minute staggered per repo so the fleet's crons don't all fire at once
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit OWN version to cut (e.g. 0.1.0). Blank = patch-bump this repo's latest v* tag, or seed the first tag."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-on-upstream-${{ github.repository }}
  cancel-in-progress: false

env:
  # This repo has never published and has zero tags; the first real release seeds here. Independent
  # of the busbar and terraform-provider version numbers — this is pulumi-busbar's OWN package version.
  SEED_VERSION: v0.1.0
  UPSTREAM_MODULE: github.com/GetBusbar/terraform-provider-busbar
  # How long a repository_dispatch wake waits for terraform-provider-busbar's own release to show up
  # before giving up (see the ordering-race note in the resolve step).
  UPSTREAM_WAIT_SECONDS: "1200"
  UPSTREAM_POLL_SECONDS: "30"

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (bypass-capable token, full history + tags)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_DISPATCH_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "busbar-bot"
          git config user.email "bot@getbusbar.com"

      - name: Resolve whether a newer terraform-provider-busbar warrants a re-cut
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          cur_pin="$(awk -v m="$UPSTREAM_MODULE" '$1==m{print $2; exit}' provider/shim/go.mod)"
          echo "current shim go.mod pin: ${cur_pin:-<none>}"

          latest_tag() {
            gh api repos/GetBusbar/terraform-provider-busbar/releases/latest --jq .tag_name 2>/dev/null || true
          }
          is_newer() { # is_newer <candidate> <current>  -> 0 when candidate > current
            [ -n "$1" ] || return 1
            [ "$1" != "$2" ] || return 1
            [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | tail -1)" = "$1" ]
          }

          target_tag="$(latest_tag)"
          echo "terraform-provider-busbar latest release: ${target_tag:-none}"

          pin_stale=no
          is_newer "$target_tag" "$cur_pin" && pin_stale=yes

          # ORDERING RACE FIX. GetBusbar/busbar's notify-downstream job fans the upstream-release
          # dispatch out to the whole fleet at once, but the sibling repo we actually depend on
          # (terraform-provider-busbar) cuts its own release from that same fan-out, so it is
          # routinely published MINUTES AFTER we are woken. Historically we resolved "latest" once,
          # saw the pre-release value, logged "nothing to do" and went green -- a misleading success
          # that left this repo a release behind until the next daily cron. On a dispatch we now WAIT
          # (bounded) for the sibling release to appear instead of concluding immediately.
          if [ "$EVENT_NAME" = repository_dispatch ] && [ "$pin_stale" = no ]; then
            echo "::notice::dispatch-triggered and no newer terraform-provider yet -> waiting up to ${UPSTREAM_WAIT_SECONDS}s for the sibling release"
            waited=0
            while [ "$waited" -lt "$UPSTREAM_WAIT_SECONDS" ]; do
              sleep "$UPSTREAM_POLL_SECONDS"
              waited=$((waited + UPSTREAM_POLL_SECONDS))
              probe="$(latest_tag)"
              echo "  +${waited}s: latest=${probe:-none}"
              if is_newer "$probe" "$cur_pin"; then
                target_tag="$probe"
                pin_stale=yes
                echo "::notice::terraform-provider ${probe} appeared after ${waited}s of waiting -> proceeding"
                break
              fi
            done
          fi

          force=no
          [ "$EVENT_NAME" = workflow_dispatch ] && force=yes

          should_cut=no
          if [ "$force" = yes ]; then
            should_cut=yes
            echo "::notice::manual workflow_dispatch -> cutting a release (pin_stale=${pin_stale})"
          elif [ "$pin_stale" = yes ]; then
            should_cut=yes
            echo "::notice::terraform-provider advanced (pinned=${cur_pin} -> ${target_tag}) -> cutting a release"
          elif [ "$EVENT_NAME" = repository_dispatch ]; then
            # Do NOT report a quiet green here: an upstream-release dispatch that ends in "nothing to
            # do" even after waiting almost always means the fan-out is broken or the sibling release
            # failed. The daily cron will still self-heal, but this must be visible in the run list.
            echo "::warning title=upstream-release dispatch produced no release::woken by an upstream-release dispatch but terraform-provider-busbar is still at ${target_tag:-none} (pin ${cur_pin:-none}) after waiting ${UPSTREAM_WAIT_SECONDS}s. Either the sibling release failed or the fan-out fired too early. This repo is NOT refreshed; the daily cron will retry."
          else
            echo "::notice::no newer terraform-provider (pinned=${cur_pin:-none}, latest=${target_tag:-none}) -> nothing to do"
          fi
          {
            echo "should_cut=$should_cut"
            echo "pin_stale=$pin_stale"
            echo "target_tag=$target_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Compute this repo's next version
        id: ver
        if: steps.resolve.outputs.should_cut == 'yes'
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            next="v${INPUT_VERSION#v}"
            echo "::notice::using explicit workflow_dispatch version -> ${next}"
          else
            latest="$(git tag --list 'v*' | sort -V | tail -1)"
            if [ -z "$latest" ]; then
              next="$SEED_VERSION"
              echo "::notice::no existing v* tag -> seeding first release ${next}"
            else
              base="${latest#v}"
              major="$(echo "$base" | cut -d. -f1)"
              minor="$(echo "$base" | cut -d. -f2)"
              patch="$(echo "$base" | cut -d. -f3)"
              next="v${major}.${minor}.$((patch + 1))"
              echo "::notice::latest tag ${latest} -> next ${next}"
            fi
          fi
          echo "tag=${next}" >> "$GITHUB_OUTPUT"

      - name: Re-pin terraform-provider-busbar + regenerate schema/SDKs
        if: steps.resolve.outputs.should_cut == 'yes' && steps.resolve.outputs.pin_stale == 'yes'
        env:
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
          NEXT_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          ( cd provider/shim && go get "${UPSTREAM_MODULE}@${TARGET_TAG}" && go mod tidy )
          ( cd provider && go mod tidy )
          make build VERSION="${NEXT_TAG#v}"

      - name: Guard — no-op if the tag already exists
        id: guard
        if: steps.resolve.outputs.should_cut == 'yes'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::notice::${TAG} already exists — idempotent no-op, exiting 0"
            echo "exists=yes" >> "$GITHUB_OUTPUT"
          else
            echo "exists=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the re-pin + regenerated SDKs to main
        if: steps.guard.outputs.exists == 'no' && steps.resolve.outputs.pin_stale == 'yes'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          TARGET_TAG: ${{ steps.resolve.outputs.target_tag }}
        run: |
          set -euo pipefail
          git add provider/go.mod provider/go.sum provider/shim/go.mod provider/shim/go.sum \
                  provider/cmd/pulumi-resource-busbar/schema-embed.json sdk
          if git diff --cached --quiet; then
            echo "::notice::pin + generated SDKs already current, no re-pin commit needed"
          else
            git commit -m "provider: re-pin terraform-provider-busbar to ${TARGET_TAG} + regenerate SDKs for the ${TAG} release"
            git push origin HEAD:main
          fi

      - name: Create and push the release tag
        if: steps.guard.outputs.exists == 'no'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "${TAG}"
          git push origin "refs/tags/${TAG}"
          # sdk/ is its own Go module (module github.com/getbusbar/pulumi-busbar/sdk), so the Go
          # toolchain only sees a version of it through a submodule-prefixed tag. Without sdk/${TAG},
          # `go get github.com/getbusbar/pulumi-busbar/sdk/go/busbar@${TAG}` fails with
          # "found, but does not contain package" - which is exactly what the README told users to
          # run. This tag has no plain v* prefix, so it does not re-trigger release.yml.
          git tag "sdk/${TAG}"
          git push origin "refs/tags/sdk/${TAG}"
          echo "::notice::pushed ${TAG} and sdk/${TAG} - release.yml will build the SDKs, publish the plugin binaries to the GitHub Release (GITHUB_TOKEN), and loud-skip npm/PyPI until their tokens are provisioned"
